<title>LAMASAT Clinic Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: inset sheet. Navigation sits directly on a sage-stone canvas; the working screen is a rounded white sheet floating on it. Bricolage Grotesque gives headings and figures character, Geist keeps the UI crisp. Neem green for actions, saffron for highlights. */
:root{
  --canvas:#E9ECE5; --bg:#F7F8F5; --surface:#FFFFFF; --surface-2:#F3F5F0; --ink:#141815; --muted:#646C66; --line:#E6E9E2; --line-2:#D5DAD1;
  --brand:#1E4D33; --brand-ink:#F4F8F2; --brand-soft:#E3EEE6; --accent:#E9A93A; --accent-soft:#FBEFD6;
  --side:transparent; --side-2:rgba(20,24,21,.06); --side-ink:#1F2621; --side-muted:#6E776F;
  --ok:#21794A; --warn:#A86A06; --bad:#C0392B; --info:#2A62A8; --violet:#7048B5;
  --sticky:#FBEFD6; --sticky-line:#EBCB8A; --sticky-ink:#5A3F0B;
  --shadow:0 1px 2px rgba(20,24,21,.05),0 8px 24px rgba(20,24,21,.07); --shadow-lg:0 24px 60px rgba(20,24,21,.22);
  --r:14px; --r-sm:10px;
  --f-head:"Bricolage Grotesque","Geist",system-ui,sans-serif; --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#0D100E; --bg:#131714; --surface:#191E1A; --surface-2:#1F2520; --ink:#EDF1EC; --muted:#99A39B; --line:#262D28; --line-2:#333C35;
  --brand:#8FD4A6; --brand-ink:#0B1A10; --brand-soft:#1D3324; --accent:#F0B955; --accent-soft:#3A2D12;
  --side-2:rgba(255,255,255,.06); --side-ink:#E2E8E2; --side-muted:#8B958D;
  --ok:#7ACB98; --warn:#EDB453; --bad:#F08A7C; --info:#8CB8EE; --violet:#BBA2EE;
  --sticky:#3A2D12; --sticky-line:#5B4720; --sticky-ink:#F3DDAA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0D100E; --bg:#131714; --surface:#191E1A; --surface-2:#1F2520; --ink:#EDF1EC; --muted:#99A39B; --line:#262D28; --line-2:#333C35;
  --brand:#8FD4A6; --brand-ink:#0B1A10; --brand-soft:#1D3324; --accent:#F0B955; --accent-soft:#3A2D12;
  --side-2:rgba(255,255,255,.06); --side-ink:#E2E8E2; --side-muted:#8B958D;
  --ok:#7ACB98; --warn:#EDB453; --bad:#F08A7C; --info:#8CB8EE; --violet:#BBA2EE;
  --sticky:#3A2D12; --sticky-line:#5B4720; --sticky-ink:#F3DDAA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-underline-offset:3px;font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.88em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%;padding:10px 10px 10px 0}
.side{color:var(--side-ink);display:flex;flex-direction:column;min-height:0;padding-left:max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:10px 12px 14px}
.brand .mk{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-head);font-size:18px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--side-muted)}
.nav{overflow-y:auto;padding:0 4px 12px;flex:1}
.nav-group{margin-top:14px}
.nav-group>div{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--side-muted);padding:2px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.nav a{display:flex;align-items:center;padding:6px 10px 6px 33px;border-radius:9px;color:var(--side-ink);text-decoration:none;font-size:13.5px;font-weight:450}
.nav a:hover{background:var(--side-2)}
.nav a.on{background:var(--surface);font-weight:600;box-shadow:var(--shadow);position:relative}
.nav a.on::before{content:"";position:absolute;left:15px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.nav a.locked{color:var(--side-muted)}
.nav a .lk{margin-left:auto;font-size:11px;color:var(--side-muted)}
.side-foot{padding:10px 4px 4px;display:flex;flex-direction:column;gap:2px}
.side-foot .who-me{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--side-2);font-size:12px;color:var(--side-muted);margin-bottom:4px}
.side-foot .who-me b{display:block;color:var(--side-ink);font-weight:600;font-size:13px}
.side-foot a{display:block;padding:5px 10px;color:var(--side-ink);text-decoration:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:450}
.side-foot a:hover{background:var(--side-2)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;margin-right:env(safe-area-inset-right,0px)}
.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.top .crumb{font-size:13px;color:var(--muted);min-width:0}
.top .crumb b{color:var(--ink);font-weight:600}
.gsearch{position:relative;flex:1;max-width:380px;margin-left:auto}
.gsearch input{width:100%;padding:7px 12px 7px 34px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13.5px}
.gsearch input:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft)}
.gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gsearch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;background:var(--surface)}
.gs-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;overflow:hidden}
.gs-res button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 12px;cursor:pointer;text-align:left}
.gs-res button:hover,.gs-res button:focus{background:var(--surface-2);outline:none}
.role{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.role select{padding:5px 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:500}
.content{overflow-y:auto;flex:1;padding-block:26px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.menu-btn{display:none}

/* page head */
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.ph h1{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.03em}
.ph p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:550;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink);line-height:1.3;transition:background .12s,transform .12s,box-shadow .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 2px 6px color-mix(in srgb,var(--brand) 30%,transparent)}
.btn.pri:hover{filter:brightness(1.12);background:var(--brand)}
.btn.warn{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line-2))}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{border:0;background:transparent;cursor:pointer;font-size:16px;padding:6px 9px;border-radius:999px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input.i,select.i,textarea.i{padding:8px 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:14px;width:100%;min-width:0;transition:border-color .12s,box-shadow .12s}
textarea.i{resize:vertical;min-height:70px;line-height:1.5}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
input[readonly].i,textarea[readonly].i,select[disabled].i{background:var(--surface-2);color:var(--ink)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label.f{width:auto;min-width:160px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;width:fit-content;max-width:100%}
.seg button{border:0;background:transparent;padding:5px 13px;cursor:pointer;font-size:13px;color:var(--muted);border-radius:999px;font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,24,21,.08),0 0 0 1px var(--line)}
.seg button .c{font-family:var(--f-mono);font-size:11px;margin-left:6px;color:var(--muted);background:var(--line);border-radius:999px;padding:0 6px}
.seg button.on .c{background:var(--accent-soft);color:var(--warn)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:0 1px 2px rgba(20,24,21,.03)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 12px;flex-wrap:wrap}
.card-h+.list,.card-h+.tw,.card-h+.card-b{border-top:1px solid var(--line)}
.card-h h3{font-size:15px;font-weight:650;letter-spacing:-.01em}
.card-b{padding:16px 18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 15px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--ink);font:inherit;box-shadow:0 1px 2px rgba(20,24,21,.03);transition:transform .14s,box-shadow .14s,border-color .14s}
button.tile{cursor:pointer}
button.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--f-head);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.03em}
.tile .s{font-size:12px;color:var(--muted)}
.tile.flag{background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.tile.bad{background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 9%,var(--surface)),var(--surface) 70%);border-color:color-mix(in srgb,var(--bad) 25%,var(--line))}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.mono,.t td:first-child{white-space:nowrap}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:color-mix(in srgb,var(--brand-soft) 45%,var(--surface))}
.t td.r,.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.t tfoot td{font-weight:650;background:var(--surface-2);border-top:1px solid var(--line-2)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.card>.tw:first-child table.t th:first-child{border-top-left-radius:var(--r)}
.card>.tw:first-child table.t th:last-child{border-top-right-radius:var(--r)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;padding:2px 10px 2px 8px;border-radius:999px;white-space:nowrap;color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 12%,var(--surface))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;font-size:11.5px;font-weight:550;padding:1px 8px;border-radius:999px;color:var(--warn);background:var(--accent-soft);white-space:nowrap}
.who{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.who small{color:var(--muted);font-size:12px}
.pt{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:650;flex:none;color:var(--avc);background:color-mix(in srgb,var(--avc) 15%,var(--surface));letter-spacing:.02em}
.av.lg{width:44px;height:44px;font-size:15px}

.note{background:var(--sticky);border:1px dashed var(--sticky-line);color:var(--sticky-ink);border-radius:var(--r);padding:12px 16px;font-size:13px}
.note summary{cursor:pointer;font-weight:650;font-family:var(--f-head)}
.note ul{margin:8px 0 0;padding-left:18px}
.banner{border-radius:var(--r-sm);padding:10px 14px;font-size:13.5px;border:1px solid}
.banner.bad{background:color-mix(in srgb,var(--bad) 8%,var(--surface));border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.banner.ok{background:color-mix(in srgb,var(--ok) 8%,var(--surface));border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
.banner.info{background:var(--surface-2);border-color:var(--line)}
.banner ul{margin:6px 0 0;padding-left:18px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}

.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:9px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:118px;text-align:left;transition:border-color .12s,background .12s}
.slot b{font-family:var(--f-head);font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.slot span{font-size:11.5px;color:var(--ok);font-weight:500}
.slot:hover{border-color:var(--brand)}
.slot.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.slot.on span{color:var(--brand-ink);opacity:.85}
.slot.busy{cursor:not-allowed;background:var(--surface-2);border-style:dashed}
.slot.busy b{color:var(--muted)}
.slot.busy span{color:var(--bad)}

.ac-list{border:1px solid var(--line);border-radius:12px;margin-top:6px;background:var(--surface);max-height:280px;overflow:auto;box-shadow:var(--shadow)}
.ac-list button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:9px 12px;cursor:pointer;text-align:left;border-bottom:1px solid var(--line);gap:8px}
.ac-list button:hover{background:var(--surface-2)}
.chosen{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));background:var(--brand-soft);border-radius:12px;padding:10px 12px}

/* timeline grid */
.sched{min-width:900px}
.sched-row{display:grid;grid-template-columns:180px 1fr;border-bottom:1px solid var(--line);min-height:56px}
.sched-row:last-child{border-bottom:0}
.sched-row .who{padding:8px 16px;justify-content:center}
.lane{position:relative;cursor:copy;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/13 - 1px),var(--line) calc(100%/13 - 1px),var(--line) calc(100%/13))}
.lane:hover{background-color:color-mix(in srgb,var(--brand-soft) 30%,transparent)}
.lane .off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,transparent 5px 10px);pointer-events:none}
.blk{position:absolute;top:7px;bottom:7px;border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.blk:hover{box-shadow:inset 0 0 0 1.5px var(--c),var(--shadow)}
.hours{display:grid;grid-template-columns:180px 1fr;font-family:var(--f-mono);font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.hours>div:last-child{display:grid;grid-template-columns:repeat(13,1fr)}
.hours span{padding:8px 4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 20px}
.tl-item::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 3px var(--c,var(--brand))}

.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--c,var(--brand));border-radius:999px}
.hbar{display:grid;grid-template-columns:120px 1fr 44px;gap:12px;align-items:center;font-size:13px;padding:6px 0}
.hbar .bar{height:12px}
.hbar b{text-align:right;font-family:var(--f-head);font-weight:650}

.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{font-size:13px;font-weight:650}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.sticky-id{position:sticky;top:-26px;z-index:3;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow)}
.sticky-id .kv{grid-template-columns:auto auto}
.lock{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:36px}
.lock h2{font-size:22px;font-weight:700}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(14,18,15,.28);backdrop-filter:blur(3px);z-index:40;display:flex;justify-content:flex-end;padding:10px}
.drawer{width:min(540px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-top:env(safe-area-inset-top,0px);margin-bottom:env(safe-area-inset-bottom,0px);margin-right:env(safe-area-inset-right,0px);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.dr-head h3{font-size:18px;font-weight:700}
.dr-body{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.dr-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface-2)}
.modal-scrim{position:fixed;inset:0;background:rgba(14,18,15,.28);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100% - 32px);align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow-lg);font-size:13.5px;max-width:560px;animation:pop .18s ease-out}

.paper{background:#fff;color:#1b1b1b;border:1px solid #e2e2dc;border-radius:10px;padding:24px;font-size:13px;font-family:var(--f-body)}
.paper h2{font-size:18px;color:#1b1b1b;font-weight:700}
.paper table{width:100%;border-collapse:collapse;margin-top:10px}
.paper td,.paper th{border-bottom:1px solid #ececec;padding:6px;text-align:left}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(900px 500px at 85% 0%,var(--accent-soft),transparent 60%),radial-gradient(800px 500px at 0% 100%,var(--brand-soft),transparent 60%),var(--canvas)}
.login .card{width:min(400px,100%);padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg);border-radius:20px}

.matrix td{text-align:center}
.matrix td:first-child{text-align:left}

@media (max-width:1320px){.split{grid-template-columns:minmax(0,1fr) 270px}.t td .btn.sm{padding:4px 9px}}
@media (max-width:1100px){.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:0}
  .main{border-radius:0;border:0}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:45;transform:translateX(-105%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);background:var(--canvas)}
  .side.open{transform:none;box-shadow:var(--shadow-lg)}
  .menu-btn{display:inline-flex}
  .g3,.g2{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  .ph h1{font-size:25px}
  .gsearch{order:5;max-width:none;flex-basis:100%}
  .gsearch kbd{display:none}
}
@media (max-width:520px){.g4{grid-template-columns:1fr}.hbar{grid-template-columns:96px 1fr 40px}.role span{display:none}.content,.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.scrim{padding:0}.drawer{border-radius:0}.tile .v{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* money helpers */
const lineNet=l=>r3(l.qty*l.rate-(l.disc||0));
function medTotals(inv){const sub=r3(inv.lines.reduce((a,l)=>a+lineNet(l),0));const vat=r3(sub*inv.vatRate);const total=r3(sub+vat);const paid=r3(inv.payments.reduce((a,p)=>a+p.amount,0));return{sub,vat,total,paid,bal:inv.status==='Reversed'?0:r3(total-paid),gross:r3(inv.lines.reduce((a,l)=>a+l.qty*l.rate,0)),disc:r3(inv.lines.reduce((a,l)=>a+(l.disc||0),0))}}
function clinTotals(inv){const gross=r3(inv.lines.reduce((a,l)=>a+(l.covered?0:l.qty*l.rate),0));const disc=r3(inv.lines.reduce((a,l)=>a+(l.covered?0:(l.disc||0)),0));const sub=r3(gross-disc);const vat=r3(sub*S.tax.services.rate);const total=r3(sub+vat);const paid=r3(inv.payments.reduce((a,p)=>a+p.amount,0));return{gross,disc,sub,vat,total,paid,bal:r3(total-paid)}}

document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const q=$('#gq');if(q){e.preventDefault();q.focus()}}});
function rerender(){const sc=$('#content')?$('#content').scrollTop:0;render();if($('#content'))$('#content').scrollTop=sc}
function head(r,desc,actions){return `<div class="ph"><div><h1>${esc(r.t)}</h1>${desc?`<p>${desc}</p>`:''}</div><div class="actions">${actions||''}</div></div>`}
function specNote(k){const s=SPEC[k];if(!s)return '';return `<details class="note"><summary>Reviewer note · spec screen ${cur().n}</summary><ul><li><b>Rule shown:</b> ${esc(s[0])}</li><li><b>To confirm:</b> ${esc(s[1])}</li></ul></details>`}
function lockView(r){return `<div class="card lock"><h2>${esc(r.t)} isn’t available to ${esc(role)}</h2><p class="muted" style="max-width:52ch">Access is granted per staff group. Ask the clinic administrator to change access in Settings › Staff access, or switch “Viewing as” to Administrator to review this screen.</p>${btnGo('dashboard','Back to dashboard',{},'pri')}</div>`}

/* layer: drawer + modal */
function drawer(title,body,foot,mount){
 $('#layer').innerHTML=`<div class="scrim" data-scrim><div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dr-head"><h3>${title}</h3><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div><div class="dr-body">${body}</div>${foot?`<div class="dr-foot">${foot}</div>`:''}</div></div>`;
 mount&&mount();const f=$('#layer input, #layer select, #layer textarea');f&&f.focus();
}
function modal(title,body,foot,mount){
 $('#layer').innerHTML=`<div class="modal-scrim" data-scrim><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dr-head"><h3>${title}</h3><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div><div class="dr-body">${body}</div>${foot?`<div class="dr-foot">${foot}</div>`:''}</div></div>`;
 mount&&mount();
}
function closeLayer(){$('#layer').innerHTML=''}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function errBox(id,msgs){const e=document.getElementById(id);if(!e)return;e.innerHTML=msgs.length?`<div class="banner bad"><b>Can’t save yet.</b><ul>${msgs.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`:''}

/* ================= scheduling core ================= */
const ACTIVE=b=>!['Cancelled','No-show'].includes(b.status);
function conflicts({staff,date,start,dur,room,pid,exclude}){
 const end=start+dur,out=[],st=ST(staff);
 if(staff){
  if(start<st.shift[0]||end>st.shift[1])out.push(`Outside ${st.name}’s shift (${fmtT(st.shift[0])} – ${fmtT(st.shift[1])}).`);
  if(start<st.brk[1]&&end>st.brk[0])out.push(`Overlaps ${st.name}’s break (${fmtT(st.brk[0])} – ${fmtT(st.brk[1])}).`);
  S.blocks.filter(b=>b.staff===staff&&b.date===date&&start<b.end&&end>b.start).forEach(b=>out.push(`${st.name} is blocked ${fmtT(b.start)} – ${fmtT(b.end)}: ${b.reason}.`));
 }
 S.bookings.filter(b=>b.id!==exclude&&b.date===date&&ACTIVE(b)&&start<b.start+b.dur&&end>b.start).forEach(b=>{
  if(staff&&b.staff===staff)out.push(`${st.name} already has ${pname(b.pid)} (${SV(b.sid).name}) at ${fmtT(b.start)}.`);
  else if(room&&b.room===room)out.push(`${room} is taken by ${pname(b.pid)} at ${fmtT(b.start)}.`);
  else if(pid&&b.pid===pid)out.push(`${pname(pid)} is already booked at ${fmtT(b.start)} (${SV(b.sid).name}).`);
 });
 if(staff)S.home.filter(h=>h.id!==exclude&&h.staff===staff&&h.date===date&&h.status==='Scheduled'&&start<h.start+h.dur+30&&end>h.start-30).forEach(h=>out.push(`${st.name} has a home visit in ${h.area} at ${fmtT(h.start)} (incl. 30 min travel buffer).`));
 return out;
}
function freeRoom(sid,date,start,dur,exclude){const t=SV(sid).room;return (S.rooms.filter(r=>r.type===t).find(r=>!S.bookings.some(b=>b.id!==exclude&&b.room===r.id&&b.date===date&&ACTIVE(b)&&start<b.start+b.dur&&start+dur>b.start))||{}).id||''}
function eligibleStaff(sid){const k=SV(sid).kind;return S.staff.filter(s=>s.role===k)}

/* ================= booking actions ================= */
function setStatus(id,status,reason){
 const b=BK(id);const prev=b.status;b.status=status;(b.log=b.log||[]).push({ts:nowStamp(),by:me(),text:`${prev} → ${status}${reason?' — '+reason:''}`});
 if(status==='Completed'&&b.pp)redeem(b.pp,b.id,true);
 if(status==='Cancelled'){
  audit('Booking cancelled','Front Desk',b.id,reason);
  if(b.pp){const pp=PPk(b.pp);const i=pp.used.findIndex(u=>u.bid===b.id);if(i>=0){pp.used.splice(i,1);toast(`Session restored to ${pp.id}. Balance ${pp.total-pp.used.length}.`)}}
  const fu=S.followups.find(f=>f.booking===b.id);if(fu){fu.status='Reopened';fu.attempts.push({ts:nowStamp(),by:me(),outcome:'Linked booking cancelled',note:`${b.id}: ${reason}`});toast(`Follow-up ${fu.id} reopened (linked booking cancelled).`)}
 }
}
function redeem(ppId,bid,auto){const pp=PPk(ppId);if(pp.used.some(u=>u.bid===bid)){if(!auto)toast(`${bid} already redeemed on ${ppId}. Balance stays ${pp.total-pp.used.length}.`);return false}
 if(pp.used.length>=pp.total){toast(`${ppId} has no sessions left.`);return false}
 pp.used.push({bid,date:TODAY});toast(`1 session used from ${ppId}. Balance ${pp.total-pp.used.length} of ${pp.total}.`);return true}

function openBooking(id){
 const b=BK(id),p=P(b.pid),s=SV(b.sid);
 const cons=S.consults.find(c=>c.bid===b.id);
 const pp=b.pp?PPk(b.pp):null;
 const fu=S.followups.find(f=>f.booking===b.id);
 const body=`<div class="grid g2"><div class="pt">${av(p.name,1)}<div class="who"><b>${esc(p.name)}</b><small class="mono">${p.id} · ${esc(p.phone)}</small></div></div><div style="text-align:right">${pill(b.status)}</div></div>
 <dl class="kv"><dt>Service</dt><dd>${esc(s.name)} · ${b.dur} min</dd><dt>When</dt><dd>${dow(b.date)} ${fmtD(b.date)}, ${fmtT(b.start)} – ${fmtT(b.start+b.dur)}</dd><dt>With</dt><dd>${esc(ST(b.staff).name)}</dd><dt>Room</dt><dd>${esc(b.room||'—')}</dd>
 ${pp?`<dt>Package</dt><dd>${esc(PKG(pp.pkg).name)} <span class="mono small">${pp.id}</span> · ${pp.total-pp.used.length} of ${pp.total} left${pp.used.some(u=>u.bid===b.id)?' · <b>session used for this visit</b>':''}</dd>`:''}
 ${fu?`<dt>Follow-up</dt><dd>${fu.id}: ${esc(fu.reason)}</dd>`:''}
 ${b.notes?`<dt>Notes</dt><dd>${esc(b.notes)}</dd>`:''}
 ${cons&&canClinical()?`<dt>Consultation</dt><dd>${link('consultation',cons.id+' ('+cons.status+')',{bid:b.id})}</dd>`:''}</dl>
 ${(b.log||[]).length?`<div class="sec"><h4>Changes</h4>${b.log.map(l=>`<div class="small"><span class="mono">${l.ts}</span> · ${esc(l.by)} · ${esc(l.text)}</div>`).join('')}</div>`:''}
 <div id="bkForm"></div>`;
 const acts=[];
 if(b.status==='Booked')acts.push(`<button class="btn pri" data-act="bkStatus" data-id="${b.id}" data-s="Arrived">Mark arrived</button>`);
 if(b.status==='Arrived')acts.push(s.kind==='Practitioner'?`<button class="btn pri" data-go="consultation" data-ctx='${esc(JSON.stringify({bid:b.id}))}'>Start consultation</button>`:`<button class="btn pri" data-act="bkStatus" data-id="${b.id}" data-s="In progress">Start session</button>`);
 if(b.status==='In progress')acts.push(`<button class="btn pri" data-act="bkStatus" data-id="${b.id}" data-s="Completed">Complete visit</button>`);
 if(['Booked','Arrived'].includes(b.status))acts.unshift(`<button class="btn warn" data-act="bkCancel" data-id="${b.id}">Cancel…</button>`,`<button class="btn" data-act="bkResched" data-id="${b.id}">Reschedule…</button>`);
 if(b.status==='Booked')acts.unshift(`<button class="btn" data-act="bkStatus" data-id="${b.id}" data-s="No-show">No-show</button>`);
 if(b.status==='Completed')acts.push(btnGo('clinic-billing','Bill this visit',{pid:b.pid}));
 acts.push(btnGo('patient-history','Patient history',{pid:b.pid},'ghost'));
 drawer(`Booking <span class="mono">${b.id}</span>`,body,acts.join(''));
}

/* 01 Dashboard */

 const r=cur(),d=ctx.date||TODAY,sf=ctx.staff||'',stf=ctx.status||'';

 const base=day.filter(b=>!sf||b.staff===sf);
 const cnt=s=>base.filter(b=>b.status===s).length;
 const rows=base.filter(b=>!stf||b.status===stf);
 const arrived=day.filter(b=>b.status==='Arrived');
 const fus=S.followups.filter(f=>['Open','Reopened'].includes(f.status)&&f.due<=d);
 const homes=S.home.filter(h=>h.date===d&&h.status!=='Cancelled');
 const html=head(r,`${dow(d)} ${fmtD(d)} · ${day.filter(b=>ACTIVE(b)).length} appointments, ${arrived.length} waiting. Open a booking to change its status.`,`<button class="btn" data-act="dash" data-d="-1" aria-label="Previous day">‹</button><input type="date" class="i" id="dDate" value="${d}" style="width:auto"><button class="btn" data-act="dash" data-d="1" aria-label="Next day">›</button>${btnGo('new-booking','+ New booking',{nb:{date:d}},'pri')}`)+
 `<div class="filters"><div class="seg" role="tablist">${['',...BSTAT].map(s=>`<button class="${s===stf?'on':''}" data-act="dashStatus" data-s="${s}">${s||'All'}<span class="c">${s?cnt(s):base.length}</span></button>`).join('')}</div>
  <label class="f">Staff member<select class="i" id="dStaff"><option value="">All staff</option>${S.staff.map(s=>`<option value="${s.id}" ${s.id===sf?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label></div>
 <div class="split"><div class="card"><div class="tw"><table class="t"><thead><tr><th>Time</th><th>Patient</th><th>Service</th><th>Staff · Room</th><th>Status</th><th></th></tr></thead><tbody>
 ${rows.length?rows.map(b=>{const s=SV(b.sid);let act='';
  if(b.status==='Booked')act=`<button class="btn sm" data-act="bkStatus" data-id="${b.id}" data-s="Arrived" data-stop>Mark arrived</button>`;
  else if(b.status==='Arrived')act=s.kind==='Practitioner'?`<button class="btn sm pri" data-stop data-go="consultation" data-ctx='${esc(JSON.stringify({bid:b.id}))}'>Start consultation</button>`:`<button class="btn sm pri" data-act="bkStatus" data-id="${b.id}" data-s="In progress" data-stop>Start session</button>`;
  else if(b.status==='In progress')act=`<button class="btn sm" data-act="bkStatus" data-id="${b.id}" data-s="Completed" data-stop>Complete</button>`;
  return `<tr class="click" data-act="openBk" data-id="${b.id}"><td class="mono">${fmtT(b.start)}<div class="small muted">${b.dur} min</div></td><td>${ptCell(b.pid)}</td><td>${esc(s.name)}${b.pp?' <span class="tag">Package</span>':''}</td><td><div class="who">${esc(ST(b.staff).name)}<small>${esc(b.room)}</small></div></td><td>${pill(b.status)}</td><td style="text-align:right">${act}</td></tr>`}).join(''):`<tr><td colspan="6" class="empty">No appointments match. ${link('new-booking','Start a new booking',{nb:{date:d}})}</td></tr>`}
 </tbody></table></div></div>
 <div class="stack">
  <div class="card"><div class="card-h"><h3>Arrived, awaiting consultation</h3><span class="tag">${arrived.length}</span></div><div class="list">${arrived.length?arrived.map(b=>`<div class="li">${ptCell(b.pid,`${fmtT(b.start)} · ${esc(ST(b.staff).name)}`)}<button class="btn sm" data-act="openBk" data-id="${b.id}">Open</button></div>`).join(''):'<div class="empty">Nobody waiting.</div>'}</div></div>
  <div class="card"><div class="card-h"><h3>Follow-ups due</h3>${link('follow-ups','View all',{})}</div><div class="list">${fus.length?fus.map(f=>`<div class="li">${ptCell(f.pid,esc(f.reason))}${pill(f.due<d?'Overdue':'Due today')}</div>`).join(''):'<div class="empty">Nothing due.</div>'}</div></div>
  <div class="card"><div class="card-h"><h3>Home visits</h3>${link('home-dashboard','Dispatch',{date:d})}</div><div class="list">${homes.length?homes.map(h=>`<div class="li"><div class="who"><b>${fmtT(h.start)} · ${esc(h.area)}</b><small>${esc(pname(h.pid))} · ${esc(h.staff?ST(h.staff).name:'Unassigned')}</small></div>${pill(h.status)}</div>`).join(''):'<div class="empty">No home visits.</div>'}</div></div>
 </div></div>`;
 return {html,mount(){ $('#dDate').onchange=e=>{ctx.date=e.target.value;rerender()};$('#dStaff').onchange=e=>{ctx.staff=e.target.value;rerender()} }};

 nb.date=nb.date||TODAY;nb.sid=nb.sid||'SV1';
 const svc=SV(nb.sid);const elig=eligibleStaff(nb.sid);
 if(!nb.staff||!elig.find(s=>s.id===nb.staff))nb.staff=elig[0].id;

 <div id="nbErr"></div>
 <div class="split"><div class="stack">
 <div class="card"><div class="card-h"><h3>1 · Patient</h3>${link('patients','Register new patient',{reg:true,back:'new-booking'})}</div><div class="card-b">

  <label class="f">${svc.kind}<select class="i" id="nbStaff">${elig.map(s=>`<option value="${s.id}" ${s.id===nb.staff?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>

   <button class="slot ${nb.custom?'on':''}" data-act="nbCustom"><b>Custom</b><span>Any other time</span></button></div>
  ${nb.custom?`<label class="f" style="max-width:220px">Custom start time<input type="time" class="i" id="nbTime" value="${nb.start!=null?hhmm(nb.start):''}" step="300"></label>`:''}
 </div></div>
 <div class="card"><div class="card-h"><h3>4 · Notes</h3></div><div class="card-b stack">

/* 03 Patients */
VIEWS['patients']=()=>{
 const r=cur();const q=ctx.q||'';
 const html=head(r,`${S.patients.length} patients. Search before registering to avoid duplicate profiles.`,`<button class="btn pri" data-act="regPatient">+ Register patient</button>`)+
 `<div class="filters"><label class="f" style="flex:1;max-width:420px">Search name, phone or ID<input class="i" id="pSearch" value="${esc(q)}" autocomplete="off" placeholder="Type to filter"></label></div>
 <div class="card"><div class="tw"><table class="t"><thead><tr><th>Patient ID</th><th>Name</th><th>Phone</th><th>Age</th><th>Last visit</th><th>Next booking</th><th></th></tr></thead><tbody id="pBody"></tbody></table></div></div>`;
 const rowsFor=q=>{const ql=q.toLowerCase();return S.patients.filter(p=>!q||p.name.toLowerCase().includes(ql)||p.phone.replace(/\s/g,'').includes(ql.replace(/\s/g,''))||p.id.toLowerCase().includes(ql)).map(p=>{
  const vis=S.bookings.filter(b=>b.pid===p.id&&b.status==='Completed').sort((a,b)=>b.date.localeCompare(a.date))[0];
  const nxt=S.bookings.filter(b=>b.pid===p.id&&b.status==='Booked'&&b.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start)[0];
  return `<tr><td class="mono">${p.id}</td><td><div class="pt">${av(p.name)}<div class="who"><b>${esc(p.name)}</b>${p.note?`<small>${esc(p.note)}</small>`:''}</div></div></td><td class="mono">${esc(p.phone)}</td><td>${age(p)}</td><td>${vis?fmtD(vis.date):'—'}</td><td>${nxt?`${fmtD(nxt.date)} ${fmtT(nxt.start)}`:'—'}</td><td style="text-align:right;white-space:nowrap">${btnGo('new-booking','Book',{nb:{pid:p.id}},'sm')} ${btnGo('patient-history','History',{pid:p.id},'sm ghost')}</td></tr>`}).join('')||`<tr><td colspan="7" class="empty">No patient matches “${esc(q)}”. <button class="btn sm pri" data-act="regPatient">Register “${esc(q)}”</button></td></tr>`};
 return {html,mount(){$('#pBody').innerHTML=rowsFor(q);const s=$('#pSearch');s.oninput=()=>{ctx.q=s.value;$('#pBody').innerHTML=rowsFor(s.value)};if(ctx.reg){ctx.reg=false;ACT.regPatient()}}};
};

/* 04 Patient history */
VIEWS['patient-history']=()=>{

 <div class="stack"><div class="card"><div class="card-h"><div class="pt">${av(p.name,1)}<div class="who"><h3>${esc(p.name)}</h3><small class="mono">${p.id}</small></div></div></div><div class="card-b"><dl class="kv"><dt>Phone</dt><dd class="mono">${esc(p.phone)}</dd><dt>Age</dt><dd>${age(p)}</dd><dt>Patient since</dt><dd>${fmtD(p.since)}</dd>${p.note?`<dt>Note</dt><dd>${esc(p.note)}</dd>`:''}</dl></div></div>
 <div class="card"><div class="card-h"><h3>Packages</h3></div><div class="list">${pps.length?pps.map(x=>`<div class="li"><div class="who"><b>${esc(PKG(x.pkg).name)}</b><small>${x.total-x.used.length} of ${x.total} left · valid to ${fmtD(x.validTo)}</small></div>${btnGo('packages','Open',{pp:x.id},'sm')}</div>`).join(''):'<div class="empty">None</div>'}</div></div>

/* 05 Follow-ups */
function fuState(f){if(f.status==='Booked'){const b=BK(f.booking);return b&&b.status==='Cancelled'?'Reopened':'Booked'}if(f.status==='Closed')return 'Closed';return f.due<TODAY?'Overdue':f.due===TODAY?'Due today':'Upcoming'}
VIEWS['follow-ups']=()=>{
 const r=cur();const tab=ctx.tab||'Overdue';
 const open=S.followups.filter(f=>['Open','Reopened'].includes(f.status));
 const by=t=>open.filter(f=>fuState(f)===t);
 const tabs=['Overdue','Due today','Upcoming','Booked / closed'];
 const list=tab==='Booked / closed'?S.followups.filter(f=>!['Open','Reopened'].includes(f.status)):by(tab);
 const html=head(r,'Patients who need a call or another appointment. Record each attempt, defer with a new date, or book the return visit.')+
 `<div class="seg">${tabs.map(t=>`<button class="${t===tab?'on':''}" data-act="fuTab" data-t="${t}">${t}<span class="c">${t==='Booked / closed'?S.followups.length-open.length:by(t).length}</span></button>`).join('')}</div>
 <div class="card"><div class="tw"><table class="t"><thead><tr><th>Patient</th><th>Reason</th><th>Source visit</th><th>Due</th><th>Assigned</th><th>Last contact</th><th>Status</th><th></th></tr></thead><tbody>
 ${list.length?list.map(f=>{const last=f.attempts[f.attempts.length-1];const src=BK(f.src);const st=f.status==='Reopened'?'Reopened':fuState(f);return `<tr><td>${ptCell(f.pid,`<span class="mono">${esc(P(f.pid).phone)}</span>`)}</td><td>${esc(f.reason)}</td><td class="small">${src?`<a href="#" data-act="openBk" data-id="${src.id}">${src.id}</a> · ${fmtD(src.date)}`:'—'}</td><td class="mono">${fmtD(f.due)}</td><td class="small">${esc(ST(f.staff).name)}<div class="muted">${esc(f.owner)}</div></td><td class="small">${last?`${esc(last.outcome)}<div class="muted mono">${last.ts}</div>`:'<span class="muted">No attempts</span>'}</td><td>${pill(st)}${f.booking?`<div class="small"><a href="#" data-act="openBk" data-id="${f.booking}">${f.booking}</a></div>`:''}</td>
 <td style="white-space:nowrap;text-align:right">${['Open','Reopened'].includes(f.status)?`<button class="btn sm" data-act="fuLog" data-id="${f.id}">Log contact</button> <button class="btn sm" data-act="fuDefer" data-id="${f.id}">Defer</button> ${btnGo('new-booking','Book return',{nb:{pid:f.pid,fu:f.id,sid:'SV2',staff:f.staff}},'sm pri')}`:''}</td></tr>`}).join(''):'<tr><td colspan="8" class="empty">Nothing in this list.</td></tr>'}
 </tbody></table></div></div>`;
 return {html};
};

   ${bk.map(b=>`<div class="blk" style="--c:${PC[b.status]};left:${pct(b.start)};width:${w(b.start,b.start+b.dur)}" data-act="openBk" data-id="${b.id}" title="${esc(pname(b.pid)+' · '+SV(b.sid).name)}">${esc(pname(b.pid).split(' ')[0])} · ${esc(SV(b.sid).name)}</div>`).join('')}
   </div></div>`}).join('')}
  </div></div></div>
  <div class="legend"><span><i style="--c:var(--info)"></i>Booked</span><span><i style="--c:var(--warn)"></i>Arrived</span><span><i style="--c:var(--ok)"></i>Completed</span><span><i style="--c:var(--accent)"></i>Home visit + travel buffer</span><span><i style="--c:var(--bad)"></i>Blocked</span><span><i style="--c:var(--muted)"></i>Break / off shift</span></div>`;

  const days=Array.from({length:7},(_,i)=>addDays(d,i));
  body=`<div class="card"><div class="tw"><table class="t"><thead><tr><th>Staff</th>${days.map(x=>`<th>${dow(x)} ${fmtD(x).slice(0,5)}</th>`).join('')}</tr></thead><tbody>${staff.map(s=>`<tr><td><b>${esc(s.name)}</b></td>${days.map(x=>{const n=S.bookings.filter(b=>b.staff===s.id&&b.date===x&&ACTIVE(b));const h=S.home.filter(v=>v.staff===s.id&&v.date===x&&v.status==='Scheduled');const busy=n.reduce((a,b)=>a+b.dur,0)+h.reduce((a,v)=>a+v.dur+60,0);const free=Math.max(0,(s.shift[1]-s.shift[0])-(s.brk[1]-s.brk[0])-busy);return `<td class="click" style="cursor:pointer" data-act="weekDay" data-d="${x}"><div class="small"><b>${n.length}</b> bookings${h.length?` · ${h.length} home`:''}</div><div class="bar" style="margin-top:4px"><i style="width:${Math.min(100,busy/((s.shift[1]-s.shift[0])||1)*100)}%"></i></div><div class="small muted">${(free/60).toFixed(1)} h free</div></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`;

 `<div class="filters"><div class="seg">${['Day','Week'].map(m=>`<button class="${m===mode?'on':''}" data-act="avMode" data-m="${m}">${m}</button>`).join('')}</div>

 <label class="f">Service<select class="i" id="avSvc"><option value="">All services</option>${S.services.map(s=>`<option value="${s.id}" ${s.id===sv?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label></div>`+body;

VIEWS['consultation']=()=>{
 const r=cur();
 if(!canClinical())return {html:lockView(r)};

 if(!bid){
  const todays=S.bookings.filter(b=>b.date===TODAY&&SV(b.sid).kind==='Practitioner'&&['Arrived','In progress','Completed'].includes(b.status)).sort((a,b)=>a.start-b.start);

 if(!c){c={id:uid('C-',S.consults,432).replace('C-','C-0'),bid,pid:b.pid,staff:b.staff,date:b.date,status:'Draft',f:{complaint:'',history:'',prakriti:'',vikriti:'',nadi:'',agni:'',bp:'',weight:'',impression:'',plan:''},meds:[],review:{date:'',reason:''},amend:[]};S.consults.push(c);if(['Arrived','Booked'].includes(b.status))setStatus(b.id,'In progress')}

 `<div class="sticky-id"><div class="pt">${av(p.name,1)}<div class="who"><b style="font-size:16px">${esc(p.name)}</b><small class="mono">${p.id} · ${age(p)} · ${p.gender==='F'?'Female':'Male'}</small></div></div><dl class="kv"><dt>Visit</dt><dd>${fmtD(b.date)} ${fmtT(b.start)} · ${b.id}</dd></dl><dl class="kv"><dt>Practitioner</dt><dd>${esc(ST(c.staff).name)}</dd></dl><div style="margin-left:auto">${pill(c.status)}</div></div>
 ${ro?`<div class="banner ok">Completed by <b>${esc(c.completedBy)}</b> at ${c.completedAt}. The record is locked; add an amendment to correct it.</div>`:`<div class="banner info small">Draft saved records stay editable. Completing records your name and time and locks the note.</div>`}

  <label class="f">Prakriti (constitution)${sel('cf_prakriti',['Vata','Pitta','Kapha','Vata-Pitta','Pitta-Vata','Pitta-Kapha','Kapha-Pitta','Vata-Kapha','Sama'],c.f.prakriti)}</label>
  <label class="f">Vikriti (current imbalance)${sel('cf_vikriti',['Vata','Pitta','Kapha','Vata-Pitta','Pitta-Kapha','Vata-Kapha'],c.f.vikriti)}</label>

  <label class="f">BP (mmHg)<input class="i" id="cf_bp" value="${esc(c.f.bp)}" placeholder="120/80" ${ro?'readonly':''}></label>
  <label class="f">Weight (kg)<input class="i" id="cf_weight" value="${esc(c.f.weight)}" ${ro?'readonly':''}></label></div></div>
 <div class="card"><div class="card-h"><h3>Impression and plan</h3></div><div class="card-b stack">
  ${MEDF.slice(2).map(([k,l,req])=>`<label class="f">${l}${req?' *':''}<textarea class="i" id="cf_${k}" ${ro?'readonly':''}>${esc(c.f[k])}</textarea></label>`).join('')}</div></div>
 <div class="card"><div class="card-h"><h3>Medicine advice <span class="small muted">→ pharmacy</span></h3>${ro?'':`<button class="btn sm" data-act="cAddMed">+ Add medicine</button>`}</div><div class="tw"><table class="t"><thead><tr><th>Medicine</th><th>Form</th><th class="r">Qty</th><th>Instructions</th>${ro?'':'<th></th>'}</tr></thead><tbody id="cMeds">

 </div>
 <div class="stack"><div class="card"><div class="card-h"><h3>Earlier consultations</h3><span class="tag">${prev.length}</span></div><div class="list">${prev.length?prev.map(x=>`<details class="li" style="display:block"><summary style="cursor:pointer"><b>${fmtD(x.date)}</b> · ${esc(ST(x.staff).name)}<div class="small muted">${esc(x.f.impression)}</div></summary><dl class="kv small" style="margin-top:8px"><dt>Complaint</dt><dd>${esc(x.f.complaint)}</dd><dt>Assessment</dt><dd>${esc([x.f.prakriti,x.f.vikriti,x.f.agni].filter(Boolean).join(' · '))}</dd><dt>Plan</dt><dd>${esc(x.f.plan)}</dd><dt>Medicines</dt><dd>${x.meds.map(m=>esc(MED(m.mid).name)).join(', ')||'—'}</dd></dl></details>`).join(''):'<div class="empty">First visit.</div>'}</div></div>

 },c};

const curConsult=()=>S.consults.find(c=>c.bid===ctx.bid);

 const r=cur();const per=ctx.per||'This month';const from=per==='Today'?TODAY:per==='Last 7 days'?addDays(TODAY,-6):'2026-11-01';const to=TODAY;const inP=d=>d>=from&&d<=to;

 const inv=r3(S.clinInv.filter(i=>inP(i.date)).reduce((a,i)=>a+clinTotals(i).total,0)+S.medInv.filter(i=>inP(i.date)).reduce((a,i)=>a+medTotals(i).total,0));

 const hv=S.home.filter(h=>inP(h.date));

 const dayInv=days.map(d=>r3(S.clinInv.filter(i=>i.date===d).reduce((a,i)=>a+clinTotals(i).total,0)+S.medInv.filter(i=>i.date===d).reduce((a,i)=>a+medTotals(i).total,0)));
 const dayCash=days.map(d=>r3([...S.clinInv,...S.medInv].flatMap(i=>i.payments).filter(p=>p.date===d).reduce((a,p)=>a+p.amount,0)));
 const vmax=Math.max(1,...dayInv,...dayCash);const W=Math.max(days.length*28,300),H=160;const bw=Math.max(4,(W-40)/days.length/2-3);

 const chart=`<svg viewBox="0 0 ${W} ${H+30}" width="100%" style="min-width:${Math.min(W,600)}px;max-width:100%" role="img" aria-label="Invoiced versus collected per day">${[0,.5,1].map(f=>`<line x1="34" x2="${W}" y1="${H-f*H*0.9}" y2="${H-f*H*0.9}" stroke="var(--line)"/><text x="30" y="${H-f*H*0.9+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(nice*f)}</text>`).join('')}
 ${days.map((d,i)=>{const x=40+i*((W-40)/days.length);const h1=dayInv[i]/nice*H*0.9,h2=dayCash[i]/nice*H*0.9;return `<rect x="${x}" y="${H-h1}" width="${bw}" height="${h1}" fill="var(--brand)" rx="2"><title>${fmtD(d)} invoiced ${money(dayInv[i])}</title></rect><rect x="${x+bw+2}" y="${H-h2}" width="${bw}" height="${h2}" fill="var(--accent)" rx="2"><title>${fmtD(d)} collected ${money(dayCash[i])}</title></rect>${days.length<=10||i%3===0?`<text x="${x+bw}" y="${H+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.slice(8)}</text>`:''}`}).join('')}</svg>`;
 const html=head(r,`Management view for ${fmtD(from)} – ${fmtD(to)}. Each measure states how the date is applied and opens its records.`)+
 `<div class="filters"><div class="seg">${['Today','Last 7 days','This month'].map(p=>`<button class="${p===per?'on':''}" data-act="anPer" data-p="${p}">${p}</button>`).join('')}</div></div>
 <div class="tiles">

  <button class="tile" data-go="billing-report" data-ctx='${esc(JSON.stringify({from,to,basis:'Payment date'}))}'><span class="k">Cash collected</span><span class="v" style="font-size:18px">${OMR(cash)}</span><span class="s">by receipt date</span></button>
  <button class="tile" data-go="medicine-report" data-ctx='${esc(JSON.stringify({from,to}))}'><span class="k">Medicine net sales</span><span class="v" style="font-size:18px">${OMR(medNet)}</span><span class="s">excl. VAT · returns on processing date</span></button>

  if(nh.staff){const c=conflicts({staff:nh.staff,date:nh.date,start:nh.start-30,dur:nh.dur+60,exclude:h.id});if(c.length)return errBox('hvErr',c)}
  nh.status=nh.staff?'Scheduled':'Unassigned';if(id){Object.assign(h,nh);audit('Home visit changed','Home Service',id,val('hvWhy'))}else S.home.push(nh);closeLayer();toast(id?'Home visit updated.':`Home visit ${nh.id} created.`);rerender()},
 homeAssign(a){const h=S.home.find(x=>x.id===a.dataset.id);drawer(`${h.staff?'Reassign':'Assign'} ${h.id}`,`<div class="small">${fmtD(h.date)} ${fmtT(h.start)} · ${esc(h.area)} · ${esc(SV(h.sid).name)} · ${h.dur} min</div><label class="f">Therapist<select class="i" id="haS">${staffOptionsFor(h,h.staff)}</select></label><div class="small muted">Availability includes a 30-minute travel buffer before and after.</div>${h.staff?'<label class="f">Reason for reassignment *<input class="i" id="haW"></label>':''}<div id="haErr"></div>`,`<button class="btn pri" data-act="homeAssignGo" data-id="${h.id}">Save</button>`)},
 homeAssignGo(a){const h=S.home.find(x=>x.id===a.dataset.id);const s=val('haS');if(h.staff&&!val('haW'))return errBox('haErr',['Enter a reason for the reassignment.']);const c=conflicts({staff:s,date:h.date,start:h.start-30,dur:h.dur+60,exclude:h.id});if(c.length)return errBox('haErr',c);const old=h.staff;h.staff=s;h.status='Scheduled';if(old)audit(`Home visit reassigned ${ST(old).name} → ${ST(s).name}`,'Home Service',h.id,val('haW'));closeLayer();toast(old?`Reassigned to ${ST(s).name}. Both schedules updated.`:`Assigned to ${ST(s).name}.`);rerender()},
 homeCancel(a){$('#homeAssign').innerHTML=`<div class="sec"><h4>Cancel visit</h4><label class="f">Reason *<input class="i" id="hcW"></label><div id="hcErr"></div><button class="btn warn" data-act="homeCancelGo" data-id="${a.dataset.id}">Confirm cancellation</button></div>`},
 homeCancelGo(a){if(!val('hcW'))return errBox('hcErr',['Enter a reason.']);const h=S.home.find(x=>x.id===a.dataset.id);h.status='Cancelled';h.notes=(h.notes?h.notes+' ':'')+'Cancelled: '+val('hcW');audit('Home visit cancelled','Home Service',h.id,val('hcW'));closeLayer();toast('Home visit cancelled.');rerender()},
 homeDone(a){const h=S.home.find(x=>x.id===a.dataset.id);h.status='Completed';closeLayer();toast(`${h.id} completed.`);rerender()},
 /* reports */
 anPer(a){ctx.per=a.dataset.p;rerender()},
 brTab(a){ctx.tab=a.dataset.t;rerender()},bkSt(a){ctx.st=a.dataset.s;rerender()},
 /* settings */
 setTab(a){ctx.tab=a.dataset.t;rerender()},
 setRate(a){if(role!=='Administrator')return toast('Only the clinic administrator can change rates.');const s=SV(a.dataset.id);const v=r3(Number(val('rate_'+s.id)));if(!(v>=0)||v===s.rate)return toast('Enter a new rate.');audit(`Rate changed: ${s.name} ${money(s.rate)} → ${money(v)}`,'Settings',s.id,'');s.rate=v;toast(`${s.name} now ${money(v)} for new bills. Issued invoices keep their amounts.`)},
 setClinic(){$$('[data-cl]').forEach(e=>S.clinic[e.dataset.cl]=e.value.trim());audit('Clinic details changed','Settings','Clinic','');toast('Clinic details saved.')},
 setHours(){const changes=[];$$('[data-wh]').forEach(e=>{const[id,k,i]=e.dataset.wh.split('|');const s=ST(id);const v=toMin(e.value);if(s[k][i]!==v)changes.push([s,k,Number(i),v])});if(!changes.length)return toast('No changes.');
  const snapshot=S.staff.map(s=>({s,shift:[...s.shift],brk:[...s.brk]}));changes.forEach(([s,k,i,v])=>s[k][i]=v);
  const hit=S.bookings.filter(b=>b.date>=TODAY&&ACTIVE(b)&&conflicts({staff:b.staff,date:b.date,start:b.start,dur:b.dur,exclude:b.id}).some(m=>m.includes('shift')||m.includes('break')));
  if(hit.length){snapshot.forEach(x=>{x.s.shift=x.shift;x.s.brk=x.brk});modal('Review affected appointments',`<p style="margin:0">${hit.length} upcoming appointment${hit.length>1?'s fall':' falls'} outside the new hours. Reschedule them first, or apply and flag them.</p><ul>${hit.map(b=>`<li>${fmtD(b.date)} ${fmtT(b.start)} · ${esc(pname(b.pid))} · ${esc(ST(b.staff).name)}</li>`).join('')}</ul>`,`<button class="btn" data-act="close">Go back</button>`);return}
  audit('Working hours changed','Settings',changes.map(c=>c[0].name).join(', '),'');toast('Working hours saved.');rerender()},
 slotDel(a){S.slotPresets=S.slotPresets.filter(m=>m!==Number(a.dataset.m));audit('Preset slot removed','Settings',fmtT(Number(a.dataset.m)),'');rerender()},
 slotAdd(){const v=val('slotNew');if(!v)return;const m=toMin(v);if(!S.slotPresets.includes(m))S.slotPresets.push(m);S.slotPresets.sort((a,b)=>a-b);audit('Preset slot added','Settings',fmtT(m),'');rerender()}
};

document.addEventListener('click',e=>{
 const sc=e.target.closest('[data-scrim]');if(sc&&e.target===sc){closeLayer();return}
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();e.stopPropagation();let c={};try{c=JSON.parse(g.dataset.ctx||'{}')}catch(x){}go(g.dataset.go,c);return}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){if(a.tagName==='A')e.preventDefault();ACT[a.dataset.act](a,e)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});
window.addEventListener('hashchange',()=>{closeLayer();render()});
render();
</script>
